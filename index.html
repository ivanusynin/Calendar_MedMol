<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Календарь МедМол УГМУ</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        .calendar-frame {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Замените эту ссылку на вашу hash-ссылку -->
    <iframe 
        class="calendar-frame"
        src="https://calendar.yandex.ru/embed/month?&layer_ids=34342013&tz_id=Asia/Yekaterinburg&layer_names=МедМол УГМУ"
        frameborder="0"
        allowfullscreen>
    </iframe>

    <!-- SDK ВКонтакте -->
    <script src="https://vk.com/js/api/xd_connection.js?2"></script>
    <script>
        if (window.VK?.WebApp) {
            window.VK.WebApp.ready();
            window.VK.WebApp.expand();
        }
    </script>
</body>
</html>
